[package]
name = "nexthive"
version = "0.1.1"
description = "NextHive — local-first backup manager with versioned Git provider backups"
authors = ["VoiLabs"]
homepage = "https://voilabs.com"
repository = "https://github.com/voilabs/nexthive"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix avoids clashes with the binary name on Windows.
name = "nexthive_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2.10"
tauri-plugin-single-instance = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled", "chrono", "backup"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2", "ssh", "https"] }
ssh2 = "0.9"
walkdir = "2"
globset = "0.4"
rsa = "0.9"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
dunce = "1"
notify = "8.2"

# RSA key generation is unusably slow with unoptimized bigint math; keep
# these crates optimized even in dev builds.
[profile.dev.package.rsa]
opt-level = 3
[profile.dev.package.num-bigint-dig]
opt-level = 3
